# Alternative to the checked-in .xcodeproj, for people who prefer XcodeGen.
#   brew install xcodegen && xcodegen generate
# The committed project is produced by tools/generate_xcodeproj.py; both
# describe the same two targets, so use whichever you like — not both.
name: VocabWallpaper
options:
  bundleIdPrefix: com.dakshpatel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VocabKit:
    path: VocabKit

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  VocabWallpaper:
    type: application
    platform: iOS
    sources:
      - path: App/VocabWallpaper
    dependencies:
      - package: VocabKit
        product: VocabKit
      - target: VocabWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dakshpatel.vocabwallpaper
        INFOPLIST_FILE: App/VocabWallpaper/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/VocabWallpaper/VocabWallpaper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  VocabWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/VocabWidget
    dependencies:
      - package: VocabKit
        product: VocabKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dakshpatel.vocabwallpaper.widget
        INFOPLIST_FILE: Widget/VocabWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widget/VocabWidget/VocabWidget.entitlements
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES

schemes:
  VocabWallpaper:
    build:
      targets:
        VocabWallpaper: all
    run:
      config: Debug
    archive:
      config: Release
