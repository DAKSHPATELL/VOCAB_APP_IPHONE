name: Build

# `push` is scoped to main on purpose: with `branches: ['**']` every push to a
# PR branch matched both triggers and ran the whole workflow twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generators:
    name: Generators and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the Xcode project
        run: python3 tools/validate_pbxproj.py

      - name: Structural check over the Swift sources
        run: python3 tools/check_swift_balance.py

      - name: vocabulary.json matches its generator
        run: |
          python3 tools/build_vocabulary.py
          git diff --exit-code -- VocabKit/Sources/VocabKit/Resources/vocabulary.json

  package:
    name: VocabKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && xcodebuild -version

      # VocabKit also supports macOS so its logic can be tested natively here,
      # without booting a simulator. The UIKit-only parts are behind
      # `#if canImport(UIKit)` and are covered by the app build below.
      - name: Test
        run: swift test --package-path VocabKit

  app:
    name: Build app and widget
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project VocabWallpaper.xcodeproj \
            -scheme VocabWallpaper \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package the simulator build
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Vokabel-simulator.zip" VocabWallpaper.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Vokabel-simulator-app
          path: Vokabel-simulator.zip
          if-no-files-found: error

      # An unsigned device build, packaged as an .ipa for sideloading tools
      # (AltStore, Sideloadly) that re-sign with the user's own Apple ID.
      # Entitlements are stripped for this variant on purpose: App Groups are
      # a paid-account capability, and leaving it in makes re-signing with a
      # free Apple ID fail. The app detects the missing group at runtime and
      # falls back to standard UserDefaults.
      - name: Archive for device, unsigned
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VocabWallpaper.xcodeproj \
            -scheme VocabWallpaper \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Vokabel.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/Vokabel.xcarchive/Products/Applications/VocabWallpaper.app Payload/
          zip -qry Vokabel-unsigned.ipa Payload
          ls -lh Vokabel-unsigned.ipa

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: Vokabel-unsigned-ipa
          path: Vokabel-unsigned.ipa
          if-no-files-found: error

  wallpapers:
    name: Render wallpapers in a simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project VocabWallpaper.xcodeproj \
            -scheme VocabWallpaper \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Boot a simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          best = None
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for device in entries:
                  if 'iPhone' in device['name']:
                      best = device['udid']
                      if 'Pro Max' in device['name']:
                          print(best); raise SystemExit
          print(best or '')
          ")
          test -n "$SIM" || { echo 'no iPhone simulator available'; exit 1; }
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b

      - name: Install and render
        run: |
          set -e
          BUNDLE=com.dakshpatel.vocabwallpaper
          xcrun simctl install "$SIM" build/Build/Products/Debug-iphonesimulator/VocabWallpaper.app
          xcrun simctl launch "$SIM" "$BUNDLE" \
            --export-wallpapers --count 8 --canvas iphone-6.7

          CONTAINER=$(xcrun simctl get_app_container "$SIM" "$BUNDLE" data)
          for _ in $(seq 1 90); do
            [ -f "$CONTAINER/Documents/export-complete" ] && break
            sleep 2
          done
          test -f "$CONTAINER/Documents/export-complete" \
            || { echo 'the app never finished rendering'; exit 1; }

          mkdir -p out
          cp -R "$CONTAINER/Documents/wallpapers/." out/
          echo '--- manifest ---'
          cat out/manifest.txt
          ls -lh out

      - name: Screenshot the running app
        run: |
          xcrun simctl io "$SIM" screenshot out/screenshot-now-tab.png
          ls -lh out/screenshot-now-tab.png

      - name: Upload wallpapers
        uses: actions/upload-artifact@v4
        with:
          name: Vokabel-wallpapers
          path: out
          if-no-files-found: error
